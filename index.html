const now = () => loc(new Date());
const fd = s => s ? s.replace('T', ' ') : '—';

const tl = v => DT.includes(v) ? tr(v) : v;

/* ---------- SERVER (Supabase REST) ---------- */
async function api(path, method = 'GET', body, prefer) {
  const h = { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' };
  if (prefer) h.Prefer = prefer;
  const r = await fetch(SUPABASE_URL + '/rest/v1/' + path, { method, headers: h, body: body === undefined ? undefined : JSON.stringify(body) });
  const t = await r.text();
  if (!r.ok) throw new Error(t);
  return t ? JSON.parse(t) : null;
}
const rpc = (fn, args) => api('rpc/' + fn, 'POST', args);
async function pages(q) {
  let all = [], o = 0;
  for (;;) { const p = await api(q + '&limit=1000&offset=' + o); all = all.concat(p); if (p.length < 1000) return all; o += 1000; }
}
const fromReq = x => ({ id: x.id, no: x.id, mid: x.machine_id, mn: x.machine_name, d: x.dept, pt: x.problem_type, ds: x.description, pr: x.priority, st: x.stopped, ra: x.reported_at, by: x.reported_by, s: x.status, ts: x.taken_by, ta: x.taken_at, tw: x.companions || [], fa: x.finished_at, ac: x.action, cl: x.cleaning, s2: x.stopped_after, sp: x.parts || [] });

// full = reload everything; otherwise only fetch what changed since the last sync
async function load(full) {
  const [m, u, c] = await Promise.all([api('machines?select=*&order=name'), api('staff_public?select=*'), api('custom_types?select=*')]);
  let n = 0;
  if (full || !lastSync) {
    const rs = await pages('requests?select=*&order=id');
    db.requests = rs.map(fromReq);
    lastSync = rs.reduce((a, x) => x.updated_at > a ? x.updated_at : a, '1970-01-01T00:00:00Z');
    const dl = await api('req_deleted?select=at&order=at.desc&limit=1');
    lastDel = dl.length ? dl[0].at : '1970-01-01T00:00:00Z';
    n = 1;
  } else {
    const ch = await api('requests?select=*&order=updated_at&updated_at=gt.' + encodeURIComponent(lastSync));
    ch.forEach(x => {
      const o = fromReq(x), i = db.requests.findIndex(r => r.id == o.id);
      if (i < 0) db.requests.push(o); else db.requests[i] = o;
      if (x.updated_at > lastSync) lastSync = x.updated_at;
    });
    const dl = await api('req_deleted?select=*&order=at&at=gt.' + encodeURIComponent(lastDel));
    dl.forEach(x => { db.requests = db.requests.filter(r => r.id != x.id); if (x.at > lastDel) lastDel = x.at; });
    n = ch.length + dl.length;
  }
  db.requests.sort((a, b) => b.id - a.id);
  db.machines = m.map(x => ({ id: String(x.id), n: x.name, d: x.dept }));
  db.techs = u.filter(x => x.role != 'op').map(x => ({ e: x.emp, nm: x.name, st: x.status, r: x.role }));
  db.ops = u.filter(x => x.role == 'op').map(x => x.emp);
  db.custom = Object.fromEntries(c.map(x => [x.k, { m: x.machine_id, l: x.label, n: x.n }]));
  const sig = JSON.stringify([m, u, c]);
  const changed = n > 0 || sig !== smallSig;
  smallSig = sig;
  return changed;
}
async function refresh() { await load(); render(); }
async function poll() {
  if (document.hidden) return;
  try { polls++; const ch = await load(polls % 30 == 0); if (ch && !dirty) render(); } catch (e) { /* try again next time */ }
}
const adm = async (fn, args) => {
  try { await rpc(fn, { p_h: me.h, ...args }); await refresh(); } catch (e) { alert(tr('netErr')); }
};

document.addEventListener('input', () => { dirty = true; });

function setLang() { lang = lang == 'ar' ? 'en' : 'ar'; localStorage.setItem('lang', lang); render(); }
function logout() { me = null; step = { s: 'emp', e: '' }; save(); render(); }
function setTab(k) { tab = k; render(); }
function setPeriod(v) { period = v; render(); }

function render() {
  dirty = false;
  document.documentElement.lang = lang;
  document.documentElement.dir = lang == 'ar' ? 'rtl' : 'ltr';
  let h = `<header class="bg-teal-800 text-white np"><div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center gap-2"><b>🛠 ${tr('app')}</b><div class="flex items-center gap-3 text-sm">${me ? `<span class="bg-teal-900 px-2 py-1 rounded">#${esc(me.e)}</span><button onclick="logout()">${tr('logout')}</button>` : ''}<button onclick="setLang()" class="border border-white/50 rounded px-2 py-1">${lang == 'ar' ? 'EN' : 'عربي'}</button></div></div></header><main class="max-w-5xl mx-auto p-4">`;
  h += !me ? loginView() : me.r == 'operator' ? opView() : me.r == 'technician' ? techView() : adminView();
  $('app').innerHTML = h + '</main>';
  if (me && me.r == 'operator') {
    const q = new URLSearchParams(location.search), qn = q.get('m');
    if (qn) {
      const m = db.machines.find(x => x.n.toLowerCase() == qn.toLowerCase());
      $('m').value = m ? m.id : 'new';
      mchg();
      if (!m) { $('mn').value = qn; $('dp').value = q.get('d') || ''; }
    } else mchg();
  }
  if (me && me.r == 'admin' && tab == 'mach' && window.QRCode) document.querySelectorAll('[data-qr]').forEach(el => new QRCode(el, { text: el.dataset.qr, width: 96, height: 96 }));
  if (!me) { const f = document.querySelector('#app input'); if (f) f.focus(); }
}

/* ---------- LOGIN ---------- */
function loginView() {
  const s = step.s;
  const bk = `<button type="button" onclick="step={s:'emp',e:''};render()" class="text-sm text-gray-500 mt-3">← ${tr('back')}</button>`;
  const wrap = b => `<div class="max-w-sm mx-auto bg-white rounded-xl shadow p-6 mt-8">${b}</div>`;
  if (s == 'emp') return wrap(`<form onsubmit="doEmp(event)" class="space-y-3"><label class="font-semibold">${tr('empNo')}</label><input id="emp" inputmode="numeric" autocomplete="off"><button class="${btn}">${tr('next')}</button></form>`);
  if (s == 'pass') return wrap(`<form onsubmit="doPass(event)" class="space-y-3"><b>#${step.e}</b><label class="block font-semibold">${tr('password')}</label><input id="pw" type="password" required><button class="${btn}">${tr('next')}</button></form>${bk}`);
  if (s == 'role') return wrap(`<b>#${step.e}</b><p class="my-3">${tr('roleQ')}</p><div class="grid gap-3"><button onclick="pickRole('operator')" class="${btn}">${tr('operator')}</button><button onclick="pickRole('tech')" class="${btn}">${tr('technician')}</button><button onclick="pickRole('sup')" class="${btn}">${tr('supervisor')}</button></div>${bk}`);
  if (s == 'newpw') return wrap(`<form onsubmit="doNew(event)" class="space-y-3"><b>#${step.e}</b><p>${tr('createPw')}</p><input id="nm" placeholder="${tr('fullName')}" required autocomplete="off"><input id="pw" type="password" placeholder="${tr('password')}" required><input id="pw2" type="password" placeholder="${tr('confirmPw')}" required><button class="${btn}">${tr('next')}</button></form>${bk}`);
  return wrap(`<p class="text-center py-4">⏳ ${tr('waiting')}</p>${bk}`);
}
function doEmp(e) {
  e.preventDefault();
  const v = $('emp').value.trim();
  if (!/^\d{3,12}$/.test(v)) return alert(tr('badEmp'));
  if (db.ops.includes(v)) { me = { e: v, r: 'operator' }; save(); return render(); }
  step = { s: (v == ADMIN_ID || v == WORKSHOP_ID || db.techs.some(t => t.e == v)) ? 'pass' : 'role', e: v };
  render();
}
async function doPass(e) {
  e.preventDefault();
  const u = step.e;
  try {
    const h = await sha($('pw').value);
    if (u == ADMIN_ID) {
      if (!(await rpc('admin_login', { p_h: h }))) return alert(tr('wrongPw'));
      me = { e: u, r: 'admin', h }; save(); return render();
    }
    if (u == WORKSHOP_ID) {
      if (!(await rpc('ws_login', { p_h: h }))) return alert(tr('wrongPw'));
      me = { e: u, r: 'workshop' }; save(); return render();
    }
    const x = await rpc('staff_login', { p_emp: u, p_hash: h });
    if (!x.ok) return alert(tr('wrongPw'));
    if (x.status == 'approved') { me = { e: u, r: x.role == 'sup' ? 'supervisor' : 'technician' }; save(); render(); }
    else { step = { s: 'wait', e: u }; render(); }
  } catch (err) { alert(tr('netErr')); }
}
async function pickRole(r) {
  const u = step.e;
  if (r == 'operator') {
    try { await rpc('register_staff', { p_emp: u, p_name: '', p_hash: '', p_role: 'op' }); } catch (e) { return alert(tr('netErr')); }
    me = { e: u, r: 'operator' }; save(); render();
  } else { step = { s: 'newpw', e: u, rl: r }; render(); }
}
async function doNew(e) {
  e.preventDefault();
  const a = $('pw').value, b = $('pw2').value, nm = $('nm').value.trim();
  if (a.length < 4) return alert(tr('pwShort'));
  if (a !== b) return alert(tr('pwMismatch'));
  try {
    const ok = await rpc('register_staff', { p_emp: step.e, p_name: nm, p_hash: await sha(a), p_role: step.rl || 'tech' });
    if (!ok) return alert(tr('regExists'));
    await load(); step = { s: 'wait', e: step.e }; render();
  } catch (err) { alert(tr('netErr')); }
}

/* ---------- OPERATOR ---------- */
function typeOpts(mid) {
  const c = Object.values(db.custom).filter(x => x.m === mid && x.n >= 2);
  return DT.map(k => `<option value="${k}">${tr(k)}</option>`).join('') + c.map(x => `<option value="c:${esc(x.l)}">${esc(x.l)}</option>`).join('') + `<option value="other">${tr('other')}</option>`;
}
function opView() {
  return `<form onsubmit="sendReq(event)" class="bg-white rounded-xl shadow p-5 space-y-3 max-w-xl mx-auto">
<h2 class="text-xl font-bold text-teal-800">⚠ ${tr('report')}</h2>
<label class="font-semibold">${tr('machine')}</label>
<select id="m" onchange="mchg()">${db.machines.map(m => `<option value="${m.id}">${esc(m.n)}</option>`).join('')}<option value="new">${tr('newMachine')}</option></select>
<div id="nm" class="hidden"><input id="mn" placeholder="${tr('machineName')}"></div>
<label class="font-semibold">${tr('dept')}</label><input id="dp" required>
<label class="font-semibold">${tr('ptype')}</label>
<select id="pt" onchange="$('ot').classList.toggle('hidden',this.value!='other')"></select>
<input id="ot" class="hidden" placeholder="${tr('otherType')}">
<label class="font-semibold">${tr('desc')}</label><textarea id="ds" rows="3" required></textarea>
<div class="grid grid-cols-2 gap-3">
<div><label class="font-semibold">${tr('priority')}</label><select id="pr"><option value="low">${tr('low')}</option><option value="medium" selected>${tr('medium')}</option><option value="high">${tr('high')}</option><option value="critical">${tr('critical')}</option></select></div>
<div><label class="font-semibold">${tr('stopped')}</label><select id="st">${yn()}</select></div></div>
<label class="font-semibold">${tr('reportedAt')}</label><input type="datetime-local" id="ra" value="${now()}" required>
<button class="${btn}">${tr('send')}</button></form>`;

function mchg() {
  const v = $('m').value, nw = v == 'new';
  $('nm').classList.toggle('hidden', !nw);
  $('mn').required = nw;
  $('dp').value = nw ? '' : db.machines.find(x => x.id == v).d;
  $('pt').innerHTML = typeOpts(nw ? '' : v);
  $('ot').classList.add('hidden');
}
async function sendReq(e) {
  e.preventDefault();
  try {
    const mv = $('m').value, dept = $('dp').value.trim();
    let m;
    if (mv == 'new') {
      const n = $('mn').value.trim();
      if (!n) return;
      m = db.machines.find(x => x.n.toLowerCase() == n.toLowerCase());
      if (!m) {
        try {
          const [row] = await api('machines', 'POST', { name: n, dept }, 'return=representation');
          m = { id: String(row.id), n: row.name, d: row.dept };
        } catch (er) {            // somebody added the same machine a moment ago
          await load();
          m = db.machines.find(x => x.n.toLowerCase() == n.toLowerCase());
          if (!m) throw er;
        }
      }
    } else m = db.machines.find(x => x.id == mv);
    const t = $('pt').value;
    let tt = t;
    if (t == 'other') { tt = $('ot').value.trim(); if (!tt) return alert(tr('typeIt')); }
    else if (t.startsWith('c:')) tt = t.slice(2);
    if (!DT.includes(tt)) await rpc('bump_custom', { p_machine: m.id, p_label: tt });
    await api('requests', 'POST', { machine_id: m.id, machine_name: m.n, dept, problem_type: tt, description: $('ds').value.trim(), priority: $('pr').value, stopped: $('st').value, reported_at: $('ra').value, reported_by: me.e });
    await load(); render(); window.scrollTo(0, 0); alert(tr('sent'));
  } catch (err) { alert(tr('netErr')); }
}

/* ---------- STATISTICS + EXCEL ---------- */
function calc() {
  const inP = s => period == 'all' || (s || '').startsWith(period);
  const rs = db.requests.filter(r => inP(r.ra));
  const M = {}, SN = {}, P = {}, PM = {}, T = {};
  rs.forEach(r => {
    const m = M[r.mid] = M[r.mid] || { n: r.mn, d: r.d, c: 0, s: 0, dt: 0, last: '', t: {} };
    m.c++; if (r.st == 'Yes') m.s++;
    if (r.ra > m.last) m.last = r.ra;
    m.t[r.pt] = (m.t[r.pt] || 0) + 1;
    if (r.st == 'Yes' && r.fa) m.dt += Math.max(0, (new Date(r.fa) - new Date(r.ra)) / 60000);
  });
  db.requests.filter(r => r.s != 'done' && r.st == 'Yes').forEach(r => { if (!SN[r.mid] || r.ra < SN[r.mid]) SN[r.mid] = r.ra; });
  db.requests.filter(r => r.s == 'done' && inP(r.fa)).forEach(r => (r.sp || []).forEach(x => {
    const k = (x.n + '|' + x.p).toLowerCase(), o = P[k] = P[k] || { n: x.n, p: x.p, c: 0, m: new Set() };
    o.c++; o.m.add(r.mn);
    const mo = r.fa.slice(0, 7), k2 = mo + '|' + r.mn + '|' + k, q = PM[k2] = PM[k2] || { mo, m: r.mn, n: x.n, p: x.p, c: 0 };
    q.c++;
  }));
  db.requests.filter(r => r.ts && inP(r.ta)).forEach(r => {
    const t = T[r.ts] = T[r.ts] || { n: 0, d: 0, ms: 0 };
    t.n++; if (r.fa) { t.d++; t.ms += new Date(r.fa) - new Date(r.ta); }
  });
  return { rs, M, SN, P, PM, T };
}
function aStats() {
  const S = calc();
  const ps = new Set(); db.requests.forEach(r => { ps.add(r.ra.slice(0, 4)); ps.add(r.ra.slice(0, 7)); });
  const ms = Object.entries(S.M).sort((a, b) => b[1].c - a[1].c);
  const pt = Object.values(S.P).sort((a, b) => b.c - a.c);
  const pm = Object.values(S.PM).sort((a, b) => b.mo.localeCompare(a.mo) || b.c - a.c);
  const tk = Object.entries(S.T);
  const none = `<p class="text-gray-500">${tr('none')}</p>`;
  const box = (t, b) => `<div class="bg-white rounded-xl shadow p-4 mb-5"><h3 class="font-bold text-teal-800 mb-3">${t}</h3>${b}</div>`;
  const kpi = (v, l) => `<div class="bg-white rounded-xl shadow p-3 text-center"><div class="text-2xl font-bold text-teal-800">${v}</div><div class="text-xs text-gray-500">${l}</div></div>`;
  const bars = (arr, col) => { const mx = Math.max(1, ...arr.map(x => x[1])); return arr.map(([l, v]) => `<div class="flex items-center gap-2 text-sm mb-1"><span class="w-28 shrink-0 truncate">${esc(l)}</span><div class="flex-1 bg-gray-100 rounded"><div class="${col} rounded text-white text-xs px-2 py-0.5" style="width:${Math.max(8, v / mx * 100)}%">${v}</div></div></div>`).join(''); };
  const th = k => `<th class="p-2 text-start">${tr(k)}</th>`;
  const ptab = `<div class="overflow-x-auto mt-4"><table class="w-full text-sm"><thead><tr class="text-gray-500 border-b">${th('partName')}${th('partNo')}${th('timesUsed')}${th('usedIn')}</tr></thead><tbody>${pt.map(x => `<tr class="border-b"><td class="p-2 font-semibold">${esc(x.n)}</td><td class="p-2 font-mono text-xs">${esc(x.p)}</td><td class="p-2 font-bold text-blue-700">${x.c}</td><td class="p-2 text-gray-500">${[...x.m].map(esc).join(', ')}</td></tr>`).join('')}</tbody></table></div>`;
  const pmtab = `<div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-gray-500 border-b">${th('month')}${th('machine')}${th('partName')}${th('timesUsed')}</tr></thead><tbody>${pm.map(x => `<tr class="border-b"><td class="p-2">${esc(x.mo)}</td><td class="p-2">${esc(x.m)}</td><td class="p-2">${esc(x.n)}${x.p ? ' <span class="font-mono text-xs text-gray-500">(' + esc(x.p) + ')</span>' : ''}</td><td class="p-2 font-bold text-blue-700">${x.c}</td></tr>`).join('')}</tbody></table></div>`;
  const mcards = ms.map(([id, m], i) => `<div class="bg-white rounded-xl shadow p-4"><div class="flex justify-between gap-3"><div><span class="text-xs text-gray-400">#${i + 1}</span><div class="font-bold text-lg">${esc(m.n)}</div><div class="text-sm text-gray-500">${esc(m.d)}</div></div><div class="text-center"><div class="text-3xl font-bold text-orange-600">${m.c}</div><div class="text-xs text-gray-500">${tr('total')}</div></div></div>
<div class="text-sm text-red-700 mt-2">${tr('stops')}: <b>${m.s}</b> · ${tr('stopDur')}: <b>${dhm(m.dt)}</b></div>
<div class="text-xs text-gray-500 mt-1">${tr('lastFault')}: ${fd(m.last)}</div>
${S.SN[id] ? `<span class="inline-block mt-2 text-xs font-bold text-white bg-red-600 rounded-full px-3 py-1">${tr('stoppedNow')} ${dhm((Date.now() - new Date(S.SN[id])) / 60000)}</span>` : ''}
<div class="flex flex-wrap gap-1 mt-2">${Object.entries(m.t).map(([k, v]) => `<span class="text-xs bg-teal-50 text-teal-800 rounded-full px-2 py-1">${esc(tl(k))}: ${v}</span>`).join('')}</div></div>`).join('');
  const techs = tk.length ? `<div class="grid md:grid-cols-2 gap-3">${tk.map(([e, t]) => `<div class="border rounded-lg p-3"><b>${who(e)}</b><div class="text-sm text-gray-600">${tr('taken')}: ${t.n} · ${tr('closedN')}: ${t.d}${t.d ? ' · ' + tr('avg') + ': ' + hm(Math.round(t.ms / t.d / 60000)) : ''}</div></div>`).join('')}</div>` : none;
  return `<div class="np flex gap-2 mb-4"><select class="flex-1" onchange="setPeriod(this.value)">${['all', ...[...ps].sort()].map(p => `<option value="${p}" ${p == period ? 'selected' : ''}>${p == 'all' ? tr('all') : p}</option>`).join('')}</select><button onclick="exportXl()" class="bg-green-700 text-white px-3 rounded-lg whitespace-nowrap font-semibold">⬇ ${tr('exportXl')}</button></div>
<div class="grid grid-cols-3 gap-3 mb-5">${kpi(S.rs.length, tr('total'))}${kpi(S.rs.filter(r => r.st == 'Yes').length, tr('stops'))}${kpi(pt.reduce((a, x) => a + x.c, 0), tr('parts2'))}</div>
${box(tr('topMach'), ms.length ? bars(ms.slice(0, 8).map(([, m]) => [m.n, m.c]), 'bg-orange-600') : none)}
<div class="grid md:grid-cols-2 gap-3 mb-5">${mcards}</div>
${box(tr('topParts'), pt.length ? bars(pt.slice(0, 8).map(x => [x.n + (x.p ? ' (' + x.p + ')' : ''), x.c]), 'bg-blue-600') + ptab : none)}
${box(tr('partsByMonth'), pm.length ? pmtab : none)}
${me.r == 'admin' ? box(tr('statsTech'), techs) : ''}`;
}
function exportXl() {
  const go = () => {
    const S = calc(), dt = s => s ? s.replace('T', ' ') : '', y = v => v ? tr(v == 'Yes' ? 'yes' : 'no') : '';
    const stf = e => { const t = db.techs.find(x => x.e == e); return (t && t.nm ? t.nm + ' ' : '') + '#' + e; };
    const wb = XLSX.utils.book_new();
    const add = (n, rows) => { if (rows.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), n.slice(0, 31)); };
    add(tr('shReq'), S.rs.map(r => ({
      [tr('reqNo')]: r.no, [tr('machine')]: r.mn, [tr('dept')]: r.d, [tr('ptype')]: tl(r.pt), [tr('priority')]: tr(r.pr), [tr('stopped')]: y(r.st),
      [tr('desc')]: r.ds, [tr('reporter')]: r.by, [tr('reportedAt')]: dt(r.ra), [tr('tech')]: r.ts ? stf(r.ts) : '', [tr('withMe2')]: cw(r).map(stf).join(', '),
      [tr('takenAt')]: dt(r.ta), [tr('finishedAt')]: dt(r.fa), [tr('status')]: tr(r.s == 'done' ? 'sDone' : r.s == 'open' ? 'sOpen' : 'sProg'),
      [tr('repMin')]: r.fa && r.ta ? Math.round((new Date(r.fa) - new Date(r.ta)) / 60000) : '', [tr('action')]: r.ac || '', [tr('clean')]: y(r.cl),
      [tr('parts2')]: (r.sp || []).map(x => x.n + (x.p ? ' (' + x.p + ')' : '')).join(', ')
    })));
    add(tr('shMach'), Object.values(S.M).sort((a, b) => b.c - a.c).map(m => ({
      [tr('machine')]: m.n, [tr('dept')]: m.d, [tr('total')]: m.c, [tr('stops')]: m.s, [tr('stopMin')]: Math.round(m.dt), [tr('lastFault')]: dt(m.last),
      [tr('ptype')]: Object.entries(m.t).map(([k, v]) => tl(k) + ': ' + v).join(', ')
    })));
    add(tr('shParts'), Object.values(S.P).sort((a, b) => b.c - a.c).map(x => ({ [tr('partName')]: x.n, [tr('partNo')]: x.p, [tr('timesUsed')]: x.c, [tr('usedIn')]: [...x.m].join(', ') })));
    add(tr('shPM'), Object.values(S.PM).sort((a, b) => b.mo.localeCompare(a.mo)).map(x => ({ [tr('month')]: x.mo, [tr('machine')]: x.m, [tr('partName')]: x.n, [tr('partNo')]: x.p, [tr('timesUsed')]: x.c })));
    if (me.r == 'admin') add(tr('shTech'), Object.entries(S.T).map(([e, t]) => ({ [tr('tech')]: stf(e), [tr('taken')]: t.n, [tr('closedN')]: t.d, [tr('repMin')]: t.d ? Math.round(t.ms / t.d / 60000) : '' })));
    if (!wb.SheetNames.length) return alert(tr('none'));
    try { wb.Workbook = { Views: [{ RTL: lang == 'ar' }] }; } catch (e) { /* optional */ }
    XLSX.writeFile(wb, 'napco-' + (period == 'all' ? 'all' : period) + '.xlsx');
  };
  if (window.XLSX) return go();
  const sc = document.createElement('script');
  sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  sc.onload = go; sc.onerror = () => alert(tr('xlErr'));
  document.head.appendChild(sc);
}

  return `<form onsubmit="addMach(event)" class="bg-white rounded-lg shadow p-3 mb-3 grid grid-cols-2 gap-2 np"><input id="an" placeholder="${tr('machineName')}" required><input id="ad" placeholder="${tr('dept')}" required><button class="${btn} col-span-2">${tr('addMachine')}</button></form>
<div class="np flex justify-between items-start gap-3 mb-3"><p class="text-sm text-gray-500">${tr('qrHint')}</p><button onclick="pr()" class="bg-teal-700 text-white px-3 py-2 rounded-lg text-sm whitespace-nowrap">🖨 ${tr('printAll')}</button></div>
<div class="grid sm:grid-cols-2 gap-3">${db.machines.length ? db.machines.map(m => `<div class="req bg-white rounded-lg shadow p-3 flex gap-3 items-center" style="break-inside:avoid"><div data-qr="${esc(base + '?m=' + encodeURIComponent(m.n) + '&d=' + encodeURIComponent(m.d))}" class="shrink-0"></div><div class="min-w-0"><b>${esc(m.n)}</b><div class="text-xs text-gray-500">${esc(m.d)}</div><button onclick="delMach('${m.id}')" class="np text-xs text-red-600 mt-2">${tr('remove')}</button></div></div>`).join('') : `<p class="text-gray-500">${tr('none')}</p>`}</div>`;
}
async function addMach(e) {
  e.preventDefault();
  const n = $('an').value.trim(), d = $('ad').value.trim();
  try {
    if (!db.machines.some(m => m.n.toLowerCase() == n.toLowerCase())) await api('machines', 'POST', { name: n, dept: d });
    await refresh();
  } catch (err) { alert(tr('netErr')); }
}
function delMach(id) { if (confirm(tr('confirmDel'))) adm('admin_delete', { p_kind: 'machine', p_id: String(id) }); }

/* ---------- SHIFT HANDOVER ---------- */
function setShift(v) { shOff = +v; render(); }
function shiftWin(off) {
  const d = new Date(), h = d.getHours();
  let s = new Date(d); s.setMinutes(0, 0, 0);
  if (h >= 19) s.setHours(19); else if (h >= 7) s.setHours(7); else { s.setDate(s.getDate() - 1); s.setHours(19); }
  s = new Date(s.getTime() - off * 43200000);
  return [loc(s), loc(new Date(s.getTime() + 43200000))];
}
function aShift() {
  const [s, e] = shiftWin(shOff);
  const op = db.requests.filter(r => r.s != 'done'), dn = db.requests.filter(r => r.s == 'done' && r.fa >= s && r.fa < e);
  const li = (r, x) => `<div class="text-sm bg-white rounded p-2 mb-1 border" style="break-inside:avoid"><b>${esc(r.mn)}</b> (${esc(r.d)}): ${esc(x)}<div class="text-xs text-gray-500">${fd(r.ra)}${r.ts ? ' · ' + who(r.ts) : ''}${r.fa ? ' → ' + fd(r.fa) : ''}</div></div>`;
  const empty = `<p class="text-sm text-gray-500">${tr('none')}</p>`;
  return `<div class="req bg-white rounded-xl shadow p-5 space-y-4"><div class="flex justify-between items-start gap-3"><div><h3 class="text-xl font-bold text-teal-800">📋 ${tr('tabShift')}</h3><p class="text-sm text-gray-500">${tr('shiftNote')}</p><p class="text-sm font-semibold">${fd(s)} → ${fd(e)}</p></div><div class="np space-y-2"><select onchange="setShift(this.value)"><option value="0" ${shOff == 0 ? 'selected' : ''}>${tr('curShift')}</option><option value="1" ${shOff == 1 ? 'selected' : ''}>${tr('prevShift')}</option></select><button onclick="pr()" class="${btn}">🖨 ${tr('print')}</button></div></div>
<div class="grid md:grid-cols-2 gap-4"><div class="border rounded-xl p-3 bg-amber-50"><h4 class="font-bold text-amber-800 mb-2">⚠ ${tr('stillOpen')}</h4>${op.length ? op.map(r => li(r, r.ds)).join('') : empty}</div><div class="border rounded-xl p-3 bg-green-50"><h4 class="font-bold text-green-800 mb-2">✅ ${tr('doneShift')}</h4>${dn.length ? dn.map(r => li(r, r.ac)).join('') : empty}</div></div></div>`;
}

/* ---------- START ---------- */
(async () => {
  $('app').innerHTML = `<p class="p-8 text-center text-gray-500">${tr('loading')}</p>`;
  try {
    await load(true);
    if (me && me.r == 'admin' && !(await rpc('admin_login', { p_h: me.h }))) me = null;
    if (me && (me.r == 'technician' || me.r == 'supervisor') && !db.techs.some(t => t.e == me.e && t.st == 'approved')) me = null;
    save();
  } catch (e) {
    $('app').innerHTML = `<div class="p-8 text-center text-red-700">${tr('netErr')}<button onclick="location.reload()" class="${btn} mt-4">↻</button></div>`;
    return;
  }
  render();
  setInterval(poll, 10000);
})();
</script>
</body>
