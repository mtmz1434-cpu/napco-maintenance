ion\nrvRejT|رفض بانتظار مراجعتك|Rejections waiting for your review\nrvProxyT|أعمال تنتظر الاعتماد أكثر من 24 ساعة|Work waiting for approval for over 24 hours\nrvNfT|«لم أجد عطلاً» خلال آخر 30 يوماً (بحسب الفني)|"No fault found" in the last 30 days - by who reported\nrvCanT|بلاغات أُلغيت|Cancelled reports\nrvCanShow|عرض البلاغات الملغاة|Show cancelled reports\nrvCanBy|ألغاه|Cancelled by\nrvNone|لا يوجد ما ينتظرك|Nothing is waiting for you\nrvNfRow|{a} من {b} بلاغ|{a} of {b} reports\nrvBy|رُفض من|Rejected by\nrvOpNo|قال المشغّل: لم يزل العطل|The operator said: not fixed\nrvObj|اعتراض الفني|Technician's objection\nrvConfirm|أؤكد الرفض (يُحتسب)|Confirm (counts)\nrvOverrule|لا يُحتسب على الفني|Do not count against him\nrvNoteOver|اكتب السبب (إلزامي إذا لم يُحتسب الرفض)|Write why (required if you do not count it)\nrvUphold|أيّد الرفض وأعد فتح العطل|Uphold and open the fault again\nrvApprove|اعتماد العمل|Approve the work\nrvArbNote|قرارك وسببه (إلزامي)|Your decision and why (required)\nrvProxy|اعتماد نيابةً عن مشرف الإنتاج|Approve on behalf of production\nrvProxyNote|سبب الاعتماد نيابةً (إلزامي)|Why you approve on his behalf (required)\nrvAuto48|يُعتمد تلقائياً بعد 48 ساعة من الإغلاق|Approved automatically 48 hours after closing\nrvNeedNote|اكتب السبب (3 أحرف على الأقل)|Write the reason (at least 3 characters)\nrvDone|تم|Done\nrvRjConf|الصيانة أكدت الرفض|Maintenance confirmed the rejection\nrvRjOver|الصيانة لم تحتسب الرفض|Maintenance did not count the rejection\nrvRjWait|الرفض بانتظار مراجعة الصيانة|The rejection is waiting for maintenance review\nrvDisp|بانتظار قرار الصيانة|Waiting for the maintenance decision\napprAuto|اعتماد تلقائي|Automatic approval\nobBtn|أعترض على الرفض|Object to the rejection\nobPh|لماذا لا توافق؟ (إلزامي)|Why do you disagree? (required)\nobSend|إرسال الاعتراض إلى الصيانة|Send the objection to maintenance\nobSent|وصل اعتراضك للصيانة|Your objection reached maintenance\nobNeed|اكتب سبب الاعتراض (3 أحرف على الأقل)|Write the reason (at least 3 character
