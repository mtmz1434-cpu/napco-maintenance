.bdw{overflow:auto;max-height:78vh;background:#fff;border-radius:.75rem;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.bd{border-collapse:collapse;font-size:11.5px;line-height:1.3;min-width:100%}

.bd td.tl{text-align:left}.bd .nw{white-space:nowrap}
.bd td.tx{min-width:7rem}

.cbar{transform-origin:bottom}.hbar{transform-origin:left}[dir=rtl] .hbar{transform-origin:right}
@media(prefers-reduced-motion:no-preference){.anim .cbar{animation:cgrow .6s cubic-bezier(.2,.8,.2,1) both}.anim .hbar{animation:hgrow .7s cubic-bezier(.2,.8,.2,1) both}.anim .cdon{animation:cfade .8s ease both}}

.pmg{border-collapse:separate;border-spacing:0;font-size:11px;direction:ltr}
.pmg th,.pmg td{border-right:1px solid #e5e7eb;border-bottom:1px solid #e5e7eb;text-align:center;padding:0}
.pmg thead th{position:sticky;top:0;background:#134e4a;color:#fff;z-index:2;padding:3px 2px;font-weight:700;height:24px}
.pmg thead tr:nth-child(2) th{top:24px;background:#0f766e;font-size:10px}
.pmg .pmg-n{position:sticky;left:0;background:#fff;z-index:1;min-width:112px;max-width:150px;text-align:left;padding:4px 6px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

function spCollect(id, r) {

    const n = d.querySelector('[data-n]').value.trim().replace(/\s+/g, ' '), no = d.querySelector('[data-p]').value.trim();

let pmV = 'grid', pmMon = null, pmSel = null, pmRel = null, pmY = null, pmSec = '';
const pmAdd = (d, n) => new Date(Date.parse(d + 'T12:00:00Z') + n * 864e5).toISOString().slice(0, 10);
// the Sunday that starts week 1 of a year (the week of 1 January); the plan of every year uses the same week numbers and months
const pmW1 = y => { const d = new Date(Date.UTC(y, 0, 1)); d.setUTCDate(1 - d.getUTCDay()); return d.toISOString().slice(0, 10); };
const pmCY = () => +ymd(new Date()).slice(0, 4);
const pmYr = () => pmY == null ? pmCY() : pmY;
const pmWk = (d, y) => Math.floor((Date.parse(d + 'T12:00:00Z') - Date.parse(pmW1(y == null ? pmYr() : y) + 'T12:00:00Z')) / 864e5 / 7) + 1;
const pmMonthOf = (d, y) => { const w = pmWk(d, y); return w < 1 || w > 52 ? -1 : PM_MST.filter(x => x <= w).length - 1; };
const pmRange = (i, y) => { const w1 = pmW1(y == null ? pmYr() : y); return [pmAdd(w1, 7 * (PM_MST[i] - 1)), pmAdd(w1, 7 * (PM_MST[i + 1] - 1) - 1)]; };
const pmMN = i => new Date(Date.UTC(2026, i, 15)).toLocaleDateString(lang == 'ar' ? 'ar' : 'en', { month: 'long', timeZone: 'UTC' });
const lvName = l => { const v = db.lv[l]; return !v ? l : v.t == LV_DEF[l] ? tr('pmL_' + l) : v.t; };
const PM_ST = { planned: ['bg-white border', ''], registered: ['bg-blue-100 text-blue-800', '🗓'], done: ['bg-green-100 text-green-800', '✓'], past: ['bg-red-100 text-red-700', ''], skipped: ['bg-gray-100 text-gray-400 line-through', '⏭'] };

function dashData() {
  const R = db.requests.filter(r => r.k != 'pm'), AL = db.requests, d0 = new Date(), td = ymd(d0), ago = n => ymd(new Date(Date.now() - n * 864e5));
  const inR = (r, a, b) => { const d = (r.ra || '').slice(0, 10); return d >= a && d <= b; };
  const live = R.filter(r => r.s != 'done'), stopped = new Set(live.filter(r => r.st == 'Yes').map(r => String(r.mid)));
  const lateL = live.filter(r => r.s == 'open' && slaOf(r).late), lateM = new Set(lateL.map(r => String(r.mid)));
  const mo = td.slice(0, 7), lm = ymd(new Date(d0.getFullYear(), d0.getMonth() - 1, 15)).slice(0, 7);
  const rep = m => av(R.filter(r => r.fa && r.ta && apprOk(r) && r.fa.startsWith(m)).map(r => Math.max(0, (new Date(r.fa) - new Date(r.ta)) / 60000)));
  const G = {}, T30 = {}, load = {};
  const a29 = ago(29), a6 = ago(6), a13 = ago(13), a7 = ago(7);
  R.filter(r => inR(r, a29, td)).forEach(r => { (G[r.mid] = G[r.mid] || []).push(r); T30[r.pt] = (T30[r.pt] || 0) + 1; });
  live.filter(r => r.s == 'prog').forEach(r => { load[r.ts] = (load[r.ts] || 0) + 1; });
  const risk = Object.entries(G).map(([id, l]) => { const c = l.length, s = l.filter(r => r.st == 'Yes').length, sn = stopped.has(id), lt = lateM.has(id); return { id, n: l[0].mn, c, s, sn, lt, score: c * 2 + s * 3 + (sn ? 5 : 0) + (lt ? 2 : 0) }; }).sort((a, b) => b.score - a.score).slice(0, 5);
  const weeks = [...Array(8).keys()].map(i => { const f = ago(6 + 7 * i), t = ago(7 * i); return { i, from: f, n: R.filter(r => inR(r, f, t)).length }; }).reverse();
  const pmOpen = AL.filter(r => r.k == 'pm' && r.s != 'done'), due = r => (r.ra || '').slice(0, 10), in7 = ago(-7);
  const pmLate = pmOpen.filter(r => due(r) < td).length;
  const pmWeek = pmOpen.filter(r => due(r) >= td && due(r) <= in7).length + (db.plans || []).filter(p => p.ac && p.nd > td && p.nd <= in7 && !pmOpen.some(r => r.pl == p.id)).length;
  const pmDone = AL.filter(r => r.k == 'pm' && r.s == 'done' && (r.fa || '').startsWith(mo)).length;
  return {
    pmLate, pmWeek, pmDone, stopped: stopped.size, openN: live.filter(r => r.s == 'open').length, progN: live.filter(r => r.s == 'prog').length, lateN: lateL.length,
    closedToday: R.filter(r => r.s == 'done' && (r.fa || '').startsWith(td)).length,
    w0: R.filter(r => inR(r, a6, td)).length, w1: R.filter(r => inR(r, a13, a7)).length,
    mttrM: rep(mo), mttrL: rep(lm), risk, weeks, types: Object.entries(T30).sort((a, b) => b[1] - a[1]).slice(0, 5), load: Object.entries(load)
  };
}

function stImpChg(v) { stImp = { t: v }; const n = $('stImpN'), b = $('stImpGo'); const k = stParse(v).length; if (n) n.textContent = tr('stImpRows').replace('{n}', k); if (b) b.disabled = !k; }
async function stImpGo() {

<div id="stStockRes">${stStockHtml()}</div></div>`;

const stLowList = () => db.st.items.filter(x => x.ac && x.mq > 0 && x.q <= x.mq).sort((a, b) => (b.mq - b.q) - (a.mq - a.q));

function stMovesV() {
  return `<div class="max-w-4xl mx-auto"><div class="np flex flex-wrap gap-2 mb-3 items-center"><input type="search" id="stq" value="${esc(stQ)}" placeholder="${esc(tr('stSearchMv'))}" oninput="stQ=this.value;stLim=60;stPaint()" class="!w-auto grow min-w-[12rem]" autocomplete="off"><button type="button" onclick="stExport('moves')" class="bg-white border px-3 py-2 rounded-lg text-sm font-semibold">⬇ ${tr('stExport')}</button></div>
<div class="np flex flex-wrap gap-2 mb-3">${['', 'receive', 'issue', 'return', 'count', 'open'].map(k => `<button type="button" onclick="stMvK='${k}';stLim=60;render()" class="px-3 py-1 rounded-full text-sm ${stMvK == k ? 'bg-teal-700 text-white' : 'bg-white border'}">${k ? tr(MV_K[k]) : tr('stAllF')}</button>`).join('')}</div><div id="stMvRes">${stMvHtml()}</div></div>`;

// ---- Excel
async function stExport(kind) {
  try {
    const bk = XW.Book(lang == 'ar'), dt = XW.date, money = stMoney();
    if (kind == 'stock') xlTable(bk, tr('stStock'), [{ h: tr('stCode'), w: 18 }, { h: tr('stName'), w: 34 }, { h: tr('stSpec'), w: 20 }, { h: tr('stUnit'), w: 8, t: 'mid' }, { h: tr('stQty'), w: 10, t: 'dec2' }, { h: tr('stMin'), w: 10, t: 'dec2' }, ...(money ? [{ h: tr('stPrice'), w: 12, t: 'dec2' }, { h: tr('stVal'), w: 14, t: 'dec2' }] : []), { h: tr('stLoc'), w: 14 }, ...(money ? [{ h: tr('stSupp'), w: 22 }] : []), { h: tr('stFits'), w: 34, t: 'wrap' }, { h: tr('status'), w: 10, t: 'mid' }],
      db.st.items.map(x => [x.cd, x.n, x.sp, x.u, x.q, x.mq, ...(money ? [x.p == null ? '' : x.p, x.p == null ? '' : Math.round(x.p * x.q * 100) / 100] : []), x.lc, ...(money ? [x.sup] : []), stMachNames(x.ms), x.ac ? '' : tr('stOff')]));

    db.st.items.map(x => [x.cd, x.n, x.sp, x.u, x.q, x.mq, x.p == null ? '' : x.p, x.p == null ? '' : Math.round(x.p * x.q * 100) / 100, x.lc, x.sup, stMachNames(x.ms), x.ac ? 'Yes' : 'No']));
  table('Store movements', 'Every movement of the store: opening balance, received, issued, returned, counted', [{ h: 'Date', w: 18, t: 'date' }, { h: 'Part no.', w: 18 }, { h: 'Part name', w: 34 }, { h: 'Type', w: 12, t: 'mid' }, { h: 'Quantity', w: 10, t: 'dec2' }, { h: 'Balance after', w: 12, t: 'dec2' }, { h: 'Unit price (SAR)', w: 12, t: 'dec2' }, { h: 'Invoice / PO', w: 20 }, { h: 'Request ID', w: 10, t: 'int' }, { h: 'By', w: 20 }, { h: 'Note', w: 34, t: 'wrap' }],
    db.st.moves.slice().sort((a, b) => a.id - b.id).map(m => [dt(m.at), m.c, m.n, MK[m.k], m.q, m.a, m.p == null ? '' : m.p, m.ref, m.rq == null ? '' : m.rq, m.bn, m.nt]));
  table('Store requests', 'Every request for spare parts: who asked, for which breakdown, who approved it, who handed it over', [{ h: 'ID', w: 8, t: 'int' }, { h: 'Date', w: 18, t: 'date' }, { h: 'Status', w: 13, t: 'mid' }, { h: 'Asked by', w: 20 }, { h: 'Machine', w: 22 }, { h: 'Breakdown ID', w: 11, t: 'int' }, { h: 'Parts', w: 56, t: 'wrap' }, { h: 'Total (SAR)', w: 13, t: 'dec2' }, { h: 'Big (5000+)', w: 10, t: 'mid' }, { h: 'Approved / sent back by', w: 20 }, { h: 'Decision date', w: 18, t: 'date' }, { h: 'Decision note', w: 30, t: 'wrap' }, { h: 'Handed over by', w: 20 }, { h: 'Handed over at', w: 18, t: 'date' }, { h: 'Note', w: 30, t: 'wrap' }],
