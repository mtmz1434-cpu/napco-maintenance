async function sendReq(e) {

          m = { id: String(row.id), n: row.name, d: row.dept };
        } catch (er) {            // somebody added the same machine a moment ago
          await load();
          m = db.machines.find(x => x.n.toLowerCase() == n.toLowerCase());

const pmDue = r => (r.ra || '').slice(0, 10);

function pmState() {
  const td = ymd(new Date()), op = db.requests.filter(r => r.k == 'pm' && r.s != 'done');

function mst(list) {
  const o = { c: list.length, s: 0, dt: 0, last: '', t: {}, rep: [], gap: [] }, ls = list.slice().sort((a, b) => a.ra.localeCompare(b.ra));
  ls.forEach((r, i) => {
    if (r.st == 'Yes') { o.s++; if (r.fa) o.dt += Math.max(0, (new Date(r.fa) - new Date(r.ra)) / 60000); }
    if (r.ra > o.last) o.last = r.ra;
    o.t[r.pt] = (o.t[r.pt] || 0) + 1;
    if (r.fa && r.ta) o.rep.push(Math.max(0, (new Date(r.fa) - new Date(r.ta)) / 60000));
    const p = ls[i - 1];
    if (p && p.fa) { const g = (new Date(r.ra) - new Date(p.fa)) / 60000; if (g > 0) o.gap.push(g); }
  });
  o.mttr = av(o.rep); o.mtbf = av(o.gap);
  return o;
}
function calc() {
  const inP = s => period == 'all' || (s || '').startsWith(period);
  const rs = db.requests.filter(r => r.k != 'pm' && inP(r.ra));
  const G = {}, M = {}, SN = {}, P = {}, PM = {}, T = {}, RCc = {};
  rs.forEach(r => (G[r.mid] = G[r.mid] || []).push(r));
  Object.entries(G).forEach(([id, l]) => { M[id] = { n: l[0].mn, d: l[0].d, ...mst(l) }; });
  db.requests.filter(r => r.s != 'done' && r.st == 'Yes').forEach(r => { if (!SN[r.mid] || r.ra < SN[r.mid]) SN[r.mid] = r.ra; });
  db.requests.filter(r => r.s == 'done' && inP(r.fa)).forEach(r => {
    if (r.rc) RCc[r.rc] = (RCc[r.rc] || 0) + 1;
    (r.sp || []).forEach(x => {
      const k = (x.n + '|' + x.p).toLowerCase(), o = P[k] = P[k] || { n: x.n, p: x.p, c: 0, m: new Set() };
      o.c++; o.m.add(r.mn);
      const mo = r.fa.slice(0, 7), k2 = mo + '|' + r.mn + '|' + k, q = PM[k2] = PM[k2] || { mo, m: r.mn, n: x.n, p: x.p, c: 0 };
      q.c++;
    });
  });
  db.requests.filter(r => r.ts && inP(r.ta)).forEach(r => {
    const t = T[r.ts] = T[r.ts] || { n: 0, d: 0, ms: 0, p: 0 };
    if (r.k == 'pm') { t.p++; return; }
    t.n++; if (r.fa) { t.d++; t.ms += new Date(r.fa) - new Date(r.ta); }
  });
  // per department: machines that broke down in the period, breakdowns, stops, downtime (same definition as the machine file), machines stopped right now
  const D = {}, dk = d => (d || '').trim() || '—', dz = k => D[k] = D[k] || { m: 0, c: 0, s: 0, dt: 0, now: 0 };
  Object.values(M).forEach(m => { const o = dz(dk(m.d)); o.m++; o.c += m.c; o.s += m.s; o.dt += m.dt; });
  const stopped = {}; db.requests.filter(r => r.k != 'pm' && r.s != 'done' && r.st == 'Yes').forEach(r => { stopped[r.mid] = dk(r.d); });
  Object.values(stopped).forEach(k => { dz(k).now++; });
  const all = Object.values(M);
  return { rs, M, SN, P, PM, T, D, RC: RCc, mttr: av([].concat(...all.map(m => m.rep))), mtbf: av([].concat(...all.map(m => m.gap))) };
}

  return `<form onsubmit="addMach(event)" class="bg-white rounded-lg shadow p-3 mb-3 grid grid-cols-2 gap-2 np"><input id="an" placeholder="${tr('machineName')}" required><input id="ad" placeholder="${tr('dept')}" required><button class="${btn} col-span-2">${tr('addMachine')}</button></form>
<div class="np flex justify-between items-start gap-3 mb-3"><p class="text-sm text-gray-500">${tr('qrHint')}</p><button onclick="pr()" class="bg-teal-700 text-white px-3 py-2 rounded-lg text-sm whitespace-nowrap">🖨 ${tr('printAll')}</button></div>
<div class="grid sm:grid-cols-2 gap-3">${db.machines.length ? db.machines.map(m => `<div class="req bg-white rounded-lg shadow p-3 flex gap-3 items-center" style="break-inside:avoid"><div data-qr="${esc(base + '?m=' + encodeURIComponent(m.n) + '&d=' + encodeURIComponent(m.d))}" class="shrink-0"></div><div class="min-w-0"><b>${esc(m.n)}</b><div class="text-xs text-gray-500">${esc(m.d)}</div><div class="np flex gap-3 mt-2"><button onclick="goM(${js(m.id)})" class="text-xs text-teal-700 font-semibold">📁 ${tr('mfile')}</button><button onclick="delMach(${js(m.id)})" class="text-xs text-red-600">${tr('remove')}</button></div></div></div>`).join('') : `<p class="text-gray-500">${tr('none')}</p>`}</div>`;
}
async function addMach(e) {
  e.preventDefault();
  const n = $('an').value.trim(), d = $('ad').value.trim();
  try {
    if (!db.machines.some(m => m.n.toLowerCase() == n.toLowerCase())) await api('machines', 'POST', { name: n, dept: d });
    await refresh();
  } catch (err) { alert(tr('netErr')); }
}
function delMach(id) { if (confirm(tr('confirmDel'))) adm('admin_delete', { p_kind: 'machine', p_id: String(id) }); }

/* ---------- SHIFT HANDOVER ---------- */
function setShift(v) { shOff = +v; render(); }
function shiftWin(off) {
  const d = new Date(), h = d.getHours();
  let s = new Date(d); s.setMinutes(0, 0, 0);
  if (h >= 19) s.setHours(19); else if (h >= 7) s.setHours(7); else { s.setDate(s.getDate() - 1); s.setHours(19); }
  s = new Date(s.getTime() - off * 43200000);
  return [loc(s), loc(new Date(s.getTime() + 43200000))];
}
function aShift() {
  const [s, e] = shiftWin(shOff);
  const op = db.requests.filter(r => r.s != 'done'), dn = db.requests.filter(r => r.s == 'done' && r.fa >= s && r.fa < e);
  const li = (r, x) => `<div class="text-sm bg-white rounded p-2 mb-1 border" style="break-inside:avoid"><b>${esc(r.mn)}</b> (${esc(r.d)}): ${esc(x)}<div class="text-xs text-gray-500">${fd(r.ra)}${r.ts ? ' · ' + who(r.ts) : ''}${r.fa ? ' → ' + fd(r.fa) : ''}</div></div>`;
  const empty = `<p class="text-sm text-gray-500">${tr('none')}</p>`;
  return `<div class="req bg-white rounded-xl shadow p-5 space-y-4"><div class="flex justify-between items-start gap-3"><div><h3 class="text-xl font-bold text-teal-800">📋 ${tr('tabShift')}</h3><p class="text-sm text-gray-500">${tr('shiftNote')}</p><p class="text-sm font-semibold">${fd(s)} → ${fd(e)}</p></div><div class="np space-y-2"><select onchange="setShift(this.value)"><option value="0" ${shOff == 0 ? 'selected' : ''}>${tr('curShift')}</option><option value="1" ${shOff == 1 ? 'selected' : ''}>${tr('prevShift')}</option></select><button onclick="pr()" class="${btn}">🖨 ${tr('print')}</button></div></div>
<div class="grid md:grid-cols-2 gap-4"><div class="border rounded-xl p-3 bg-amber-50"><h4 class="font-bold text-amber-800 mb-2">⚠ ${tr('stillOpen')}</h4>${op.length ? op.map(r => li(r, r.ds)).join('') : empty}</div><div class="border rounded-xl p-3 bg-green-50"><h4 class="font-bold text-green-800 mb-2">✅ ${tr('doneShift')}</h4>${dn.length ? dn.map(r => li(r, r.ac)).join('') : empty}</div></div></div>`;
}

/* ---------- PREVENTIVE MAINTENANCE PLANS ---------- */
function editPM(v) { pmEdit = v; render(); }
function pmForm(p) {
  const L2 = k => `<label class="text-sm font-semibold">${tr(k)}</label>`;
  return `<form onsubmit="savePM(event,${js(p ? p.id : '')})" class="bg-white rounded-xl shadow p-4 mb-3 space-y-2 border-2 border-teal-600"><b class="text-teal-800">${p ? '✏ ' + tr('edit') : '+ ' + tr('addPlan')}</b>
${L2('machine')}<select id="pmm">${db.machines.map(m => `<option value="${m.id}" ${p && String(p.mid) == String(m.id) ? 'selected' : ''}>${esc(m.n)}</option>`).join('')}</select>
${L2('planTitle')}<input id="pmt" value="${esc(p ? p.t : '')}" required>
<div class="grid grid-cols-2 gap-2"><div>${L2('everyDays')}<input id="pmi" type="number" min="1" value="${p ? p.iv : 30}" required></div><div>${L2('priority')}<select id="pmp">${['low', 'medium', 'high', 'critical'].map(k => `<option value="${k}" ${k == (p ? p.pr : 'medium') ? 'selected' : ''}>${tr(k)}</option>`).join('')}</select></div></div>
${L2('firstDue')}<input id="pmd" type="date" value="${esc(p ? p.nd : ymd(new Date()))}" required>
${L2('planChecklist')}<textarea id="pmc" rows="5">${esc(p ? p.ck.join('\n') : '')}</textarea>
<label class="flex items-center gap-2 text-sm"><input type="checkbox" id="pma" ${!p || p.ac ? 'checked' : ''}> ${tr('planActive')}</label>
<div class="flex gap-2"><button class="${btn}">${tr('savePlan')}</button><button type="button" onclick="editPM(null)" class="w-full border rounded-lg py-3 font-bold">${tr('cancel')}</button></div></form>`;
}
function aPM() {
  const isA = me.r == 'admin', pl = db.plans || [], td = ymd(new Date());
  const form = isA && pmEdit != null ? pmForm(pmEdit === 'new' ? null : pl.find(p => p.id == pmEdit)) : '';
  const items = pl.map(p => {
    const op = db.requests.find(r => r.pl == p.id && r.s != 'done'), late = p.ac && p.nd < td;
    return `<div class="bg-white rounded-xl shadow p-4 mb-3 ${p.ac ? '' : 'opacity-60'}"><div class="flex justify-between gap-2"><div><b>${esc(p.mn)}</b><div class="text-sm">${esc(p.t)}</div></div><span class="text-xs font-bold text-blue-800 bg-blue-100 rounded-full px-2 py-1 h-fit whitespace-nowrap">${tr('every')} ${p.iv} ${tr('days')}</span></div>
<div class="text-xs text-gray-500 mt-1">${tr('planNext')}: <b class="${late ? 'text-red-600' : ''}">${esc(p.nd)}</b> · ${tr('planLast')}: ${p.ld ? fd(p.ld) : '—'} · ${tr('planItems')}: ${p.ck.length}${op ? ' · ' + tr(op.s == 'open' ? 'sOpen' : 'sProg') : ''}${p.ac ? '' : ' · ⏸'}</div>
${isA ? `<div class="np flex gap-3 mt-2"><button onclick="editPM(${js(p.id)})" class="text-xs text-teal-700 font-semibold">✏ ${tr('edit')}</button><button onclick="delPM(${js(p.id)})" class="text-xs text-red-600 font-semibold">🗑 ${tr('remove')}</button></div>` : ''}</div>`;
  }).join('');
  return (isA && pmEdit == null ? `<button onclick="editPM('new')" class="${btn} mb-3 np">+ ${tr('addPlan')}</button>` : '') + form + (items || (form ? '' : `<p class="text-gray-500">${tr('noPlans')}</p>`));
}
async function savePM(e, id) {
  e.preventDefault();
  const items = $('pmc').value.split('\n').map(x => x.trim()).filter(Boolean), iv = +$('pmi').value;
  if (!(iv >= 1)) return;
  pmEdit = null;
  await adm('admin_pm_save', { p_id: id, p_machine_id: $('pmm').value, p_title: $('pmt').value.trim(), p_interval: iv, p_priority: $('pmp').value, p_checklist: items, p_next_due: $('pmd').value, p_active: $('pma').checked });
  await genPM(); render();
}
function delPM(id) { if (confirm(tr('confirmPlan'))) adm('admin_delete', { p_kind: 'plan', p_id: String(id) }); }

/* ---------- DASHBOARD ---------- */
function dashData() {
  const R = db.requests.filter(r => r.k != 'pm'), AL = db.requests, d0 = new Date(), td = ymd(d0), ago = n => ymd(new Date(Date.now() - n * 864e5));
  const inR = (r, a, b) => { const d = (r.ra || '').slice(0, 10); return d >= a && d <= b; };
  const live = R.filter(r => r.s != 'done'), stopped = new Set(live.filter(r => r.st == 'Yes').map(r => String(r.mid)));
  const lateL = live.filter(r => r.s == 'open' && slaOf(r).late), lateM = new Set(lateL.map(r => String(r.mid)));
  const mo = td.slice(0, 7), lm = ymd(new Date(d0.getFullYear(), d0.getMonth() - 1, 15)).slice(0, 7);
  const rep = m => av(R.filter(r => r.fa && r.ta && r.fa.startsWith(m)).map(r => Math.max(0, (new Date(r.fa) - new Date(r.ta)) / 60000)));
  const G = {}, T30 = {}, load = {};
  R.filter(r => inR(r, ago(29), td)).forEach(r => { (G[r.mid] = G[r.mid] || []).push(r); T30[r.pt] = (T30[r.pt] || 0) + 1; });
  live.filter(r => r.s == 'prog').forEach(r => { load[r.ts] = (load[r.ts] || 0) + 1; });
  const risk = Object.entries(G).map(([id, l]) => { const c = l.length, s = l.filter(r => r.st == 'Yes').length, sn = stopped.has(id), lt = lateM.has(id); return { id, n: l[0].mn, c, s, sn, lt, score: c * 2 + s * 3 + (sn ? 5 : 0) + (lt ? 2 : 0) }; }).sort((a, b) => b.score - a.score).slice(0, 5);
  const weeks = [...Array(8).keys()].map(i => ({ i, from: ago(6 + 7 * i), n: R.filter(r => inR(r, ago(6 + 7 * i), ago(7 * i))).length })).reverse();
  const pmOpen = AL.filter(r => r.k == 'pm' && r.s != 'done'), due = r => (r.ra || '').slice(0, 10), in7 = ago(-7);
  const pmLate = pmOpen.filter(r => due(r) < td).length;
  const pmWeek = pmOpen.filter(r => due(r) >= td && due(r) <= in7).length + (db.plans || []).filter(p => p.ac && p.nd > td && p.nd <= in7 && !pmOpen.some(r => r.pl == p.id)).length;
  const pmDone = AL.filter(r => r.k == 'pm' && r.s == 'done' && (r.fa || '').startsWith(mo)).length;
  return {
    pmLate, pmWeek, pmDone, stopped: stopped.size, openN: live.filter(r => r.s == 'open').length, progN: live.filter(r => r.s == 'prog').length, lateN: lateL.length,
    closedToday: R.filter(r => r.s == 'done' && (r.fa || '').startsWith(td)).length,
    w0: R.filter(r => inR(r, ago(6), td)).length, w1: R.filter(r => inR(r, ago(13), ago(7))).length,
    mttrM: rep(mo), mttrL: rep(lm), risk, weeks, types: Object.entries(T30).sort((a, b) => b[1] - a[1]).slice(0, 5), load: Object.entries(load)
  };
}
// next preventive jobs: everything overdue plus what falls due in the next 14 days (tap a row to open the machine file)
function pmBox() {
  const l = pmState().items.filter(x => x.d <= 14).slice(0, 8);
  const st = x => x.d < 0 ? `<span class="text-xs font-bold text-white bg-red-600 rounded-full px-2 py-1 whitespace-nowrap">${tr('pmOverdueBy')} ${-x.d} ${tr('days')}</span>`
    : x.d == 0 ? `<span class="text-xs font-bold text-blue-800 bg-blue-100 rounded-full px-2 py-1 whitespace-nowrap">${tr('pmToday')}</span>`
    : `<span class="text-xs font-bold ${x.d <= PM_SOON ? 'text-amber-800 bg-amber-100' : 'text-gray-600 bg-gray-100'} rounded-full px-2 py-1 whitespace-nowrap">${tr('pmInD').replace('{n}', x.d)}</span>`;
  return box('🗓 ' + tr('pmUpcoming'), l.length ? l.map(x => `<div onclick="goM(${js(x.mid)})" class="flex justify-between items-center gap-2 border-b py-2 cursor-pointer"><div class="min-w-0"><b>${esc(x.mn)}</b><div class="text-xs text-gray-500">${esc(x.t)} · ${esc(x.due)}${x.s == 'prog' ? ' · ' + tr('sProg') : ''}</div></div>${st(x)}</div>`).join('') : `<p class="text-gray-500">${tr('none')}</p>`);
}
function aDash() {
  const d = dashData(), none = `<p class="text-gray-500">${tr('none')}</p>`, mm = v => v == null ? tr('na') : dhm(v);
  const arrow = (a, b) => a > b ? '▲' : a < b ? '▼' : '＝';
  const bd = x => x.score >= 10 ? 'bg-red-100 text-red-700' : x.score >= 5 ? 'bg-amber-100 text-amber-800' : 'bg-gray-100 text-gray-600';
  return `<div class="grid grid-cols-2 sm:grid-cols-5 gap-3 mb-3">${kpi(d.stopped, tr('stoppedMach'), d.stopped ? 'text-red-600' : 'text-teal-800')}${kpi(d.openN, tr('notTaken'), d.openN ? 'text-orange-600' : 'text-teal-800')}${kpi(d.progN, tr('progN'))}${kpi(d.lateN, tr('lateN'), d.lateN ? 'text-red-600' : 'text-teal-800')}${kpi(d.closedToday, tr('closedToday'), 'text-green-700')}</div>
<div class="grid grid-cols-2 gap-3 mb-5">${kpi(d.w0 + ' ' + arrow(d.w0, d.w1), tr('last7bk') + ' (' + tr('prev7') + ': ' + d.w1 + ')')}${kpi(mm(d.mttrM), tr('mttrMonth') + ' (' + tr('lastMonth') + ': ' + mm(d.mttrL) + ')')}</div>
<div class="grid grid-cols-3 gap-3 mb-5">${kpi(d.pmLate, tr('pmLate'), d.pmLate ? 'text-red-600' : 'text-teal-800')}${kpi(d.pmWeek, tr('pmWeek'), 'text-blue-700')}${kpi(d.pmDone, tr('pmDoneM'), 'text-green-700')}</div>
${pmBox()}
${box(tr('riskMach'), d.risk.length ? d.risk.map(x => `<div onclick="goM(${js(x.id)})" class="flex justify-between items-center gap-2 border-b py-2 cursor-pointer"><div><b>${esc(x.n)}</b><div class="text-xs text-gray-500">${tr('total')}: ${x.c} · ${tr('stops')}: ${x.s}</div></div><div class="flex flex-wrap gap-1 justify-end">${x.sn ? `<span class="text-xs font-bold text-white bg-red-600 rounded-full px-2 py-1">${tr('stoppedMach')}</span>` : ''}${x.lt ? `<span class="text-xs font-bold text-red-700 bg-red-100 rounded-full px-2 py-1">${tr('overdue')}</span>` : ''}<span class="text-xs font-bold rounded-full px-2 py-1 ${bd(x)}">${x.score}</span></div></div>`).join('') + `<p class="text-xs text-gray-500 mt-2">${tr('riskNote')}</p>` : none)}
${box(tr('weekly'), bars(d.weeks.map(w => [w.i == 0 ? tr('last7') : tr('wkOf') + ' ' + w.from.slice(5), w.n]), 'bg-orange-600'))}
${box(tr('typesRecent'), d.types.length ? bars(d.types.map(([k, v]) => [tl(k), v]), 'bg-blue-600') : none)}
${me.r == 'admin' ? box(tr('workload'), d.load.length ? d.load.map(([e, n]) => `<div class="flex justify-between border-b py-1 text-sm"><span>${who(e)}</span><b>${n}</b></div>`).join('') : none) : ''}`;
}

/* ---------- WORKSHOP SCREEN MODE ---------- */
function toggleTv() {
  tv = !tv;
  const d = document.documentElement;
  if (tv && d.requestFullscreen) d.requestFullscreen().catch(() => {});
  if (!tv && document.fullscreenElement && document.exitFullscreen) document.exitFullscreen();
  render();
}
document.addEventListener('fullscreenchange', () => { if (tv && document.fullscreenEnabled && !document.fullscreenElement) { tv = false; render(); } });

  render();
  setInterval(poll, 10000);
})();
