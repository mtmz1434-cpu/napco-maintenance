// supervisor / admin alerts: overdue requests + the same fault 3+ times on a machine within 30 days

/* ---------- SERVER (Supabase REST) ---------- */
async function api(path, method = 'GET', body, prefer) {
  const h = { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' };
  if (prefer) h.Prefer = prefer;
  const r = await fetch(SUPABASE_URL + '/rest/v1/' + path, { method, headers: h, body: body === undefined ? undefined : JSON.stringify(body) });
  const t = await r.text();
  if (!r.ok) throw new Error(t);
  return t ? JSON.parse(t) : null;
}
const rpc = (fn, args) => api('rpc/' + fn, 'POST', args);
async function pages(q) {
  let all = [], o = 0;
  for (;;) { const p = await api(q + '&limit=1000&offset=' + o); all = all.concat(p); if (p.length < 1000) return all; o += 1000; }
}
const fromReq = x => ({ id: x.id, no: x.id, mid: x.machine_id, mn: x.machine_name, d: x.dept, pt: x.problem_type, ds: x.description, pr: x.priority, st: x.stopped, ra: x.reported_at, by: x.reported_by, s: x.status, ts: x.taken_by, ta: x.taken_at, tw: x.companions || [], fa: x.finished_at, ac: x.action, cl: x.cleaning, s2: x.stopped_after, sp: x.parts || [], rc: x.root_cause, cr: x.created_at, k: x.kind || 'bd', pl: x.plan_id, ck: x.checklist || [] });

// full = reload everything; otherwise only fetch what changed since the last sync
async function load(full) {
  const [m, u, c, pp] = await Promise.all([api('machines?select=*&order=name'), api('staff_public?select=*'), api('custom_types?select=*'), api('pm_plans?select=*&order=next_due').catch(() => [])]);
  let n = 0;
  if (full || !lastSync) {
    const rs = await pages('requests?select=*&order=id');
    db.requests = rs.map(fromReq);
    lastSync = rs.reduce((a, x) => x.updated_at > a ? x.updated_at : a, '1970-01-01T00:00:00Z');
    const dl = await api('req_deleted?select=at&order=at.desc&limit=1');
    lastDel = dl.length ? dl[0].at : '1970-01-01T00:00:00Z';
    n = 1;
  } else {
    const ch = await api('requests?select=*&order=updated_at&updated_at=gt.' + encodeURIComponent(lastSync));
    ch.forEach(x => {
      const o = fromReq(x), i = db.requests.findIndex(r => r.id == o.id);
      if (i < 0) db.requests.push(o); else db.requests[i] = o;
      if (x.updated_at > lastSync) lastSync = x.updated_at;
    });
    const dl = await api('req_deleted?select=*&order=at&at=gt.' + encodeURIComponent(lastDel));
    dl.forEach(x => { db.requests = db.requests.filter(r => r.id != x.id); if (x.at > lastDel) lastDel = x.at; });
    n = ch.length + dl.length;
  }
  db.requests.sort((a, b) => b.id - a.id);
  db.machines = m.map(x => ({ id: String(x.id), n: x.name, d: x.dept, sn: x.serial, md: x.model, lc: x.location, ins: x.installed, nt: x.notes }));
  db.techs = u.filter(x => x.role != 'op').map(x => ({ e: x.emp, nm: x.name, st: x.status, r: x.role }));
  db.ops = u.filter(x => x.role == 'op').map(x => x.emp);
  db.custom = Object.fromEntries(c.map(x => [x.k, { m: x.machine_id, l: x.label, n: x.n }]));
  db.plans = pp.map(x => ({ id: x.id, mid: x.machine_id, mn: x.machine_name, d: x.dept, t: x.title, iv: x.interval_days, pr: x.priority, ck: x.checklist || [], nd: x.next_due, ac: x.active, ld: x.last_done }));
  const sig = JSON.stringify([m, u, c, pp]);
  const changed = n > 0 || sig !== smallSig;
  smallSig = sig;
  return changed;
}

  const all = db.requests.filter(x => x.s == 'done' && String(x.mid) == String(r.mid) && x.id != r.id).sort((a, b) => (b.fa || '').localeCompare(a.fa || '')), l = all.slice(0, 10);
  const body = l.length ? l.map(x => `<div class="border-t border-gray-200 pt-2 mt-2"><div class="flex justify-between gap-2"><b>${tr('reqNo')} ${x.no} · ${esc(tl(x.pt))}</b><span class="text-xs text-gray-500">${fd(x.fa)}</span></div><div class="text-xs text-gray-500">${who(x.ts)}${crewTxt(x)} · ${fd(x.ta)} → ${fd(x.fa)}</div><div class="mt-1">${esc(x.ac)}</div>${x.rc ? `<div class="text-xs"><b>${tr('rootCause')}:</b> ${esc(rl(x.rc))}</div>` : ''}${x.sp.length ? `<div class="text-xs"><b>${tr('parts2')}:</b> ${x.sp.map(p => esc(p.n) + (p.p ? ' (' + esc(p.p) + ')' : '')).join(', ')}</div>` : ''}</div>`).join('') + (all.length > 10 ? `<p class="text-xs text-gray-500 mt-2">${tr('machHistMore')} ${all.length}</p>` : '') : `<p class="text-gray-500 mt-2">${tr('none')}</p>`;

async function take(e, id) {
  e.preventDefault();
  try {
    const crew = [...document.querySelectorAll('#tw' + id + ' input:checked')].map(i => i.value);
    const rows = await api('requests?id=eq.' + id + '&status=eq.open', 'PATCH', { status: 'prog', taken_by: me.e, taken_at: $('ta' + id).value, companions: crew }, 'return=representation');
    if (!rows.length) alert(tr('takenByOther'));
    await load(); render();
  } catch (err) { alert(tr('netErr')); }
}
function pchg(id, v) {
  $('pb' + id).classList.toggle('hidden', v != 'Yes');
  if (v == 'Yes' && !$('pl' + id).children.length) addPart(id);
}
function addPart(id) {
  const d = document.createElement('div');

  d.innerHTML = `<input placeholder="${tr('partName')}"><input placeholder="${tr('partNo')}">`;
  $('pl' + id).appendChild(d);

async function fin(e, id) {
  e.preventDefault();
  const r = db.requests.find(x => x.id == id), fa = $('fa' + id).value;
  if (fa < r.ta) return alert(tr('dateErr'));
  const sp = $('sp' + id).value == 'Yes' ? [...$('pl' + id).querySelectorAll('.pr')].map(d => { const i = d.querySelectorAll('input'); return { n: i[0].value.trim(), p: i[1].value.trim() }; }).filter(x => x.n || x.p) : [];
  let rc = null, ck = null;
  if (r.k == 'pm') {
    ck = (r.ck || []).map((c, i) => ({ t: c.t, r: $('ck' + id + '_' + i).value, n: $('cn' + id + '_' + i).value.trim() }));
    if (ck.some(c => !c.r)) return alert(tr('ckAll'));
  } else {
    rc = $('rc' + id).value;
    if (rc == 'other') { rc = $('rco' + id).value.trim(); if (!rc) return alert(tr('rcTypeIt')); }
    if (!rc) return alert(tr('rcPick'));
  }
  try {
    await api('requests?id=eq.' + id + '&taken_by=eq.' + me.e, 'PATCH', { status: 'done', root_cause: rc, ...(ck ? { checklist: ck } : {}), finished_at: fa, action: $('ac' + id).value.trim(), cleaning: $('cl' + id).value, stopped_after: $('s2' + id).value, parts: sp });
    await load(); render(); window.scrollTo(0, 0); alert(tr('closedMsg'));

}

/* ---------- STATISTICS + EXCEL ---------- */
function mst(list) {
  const o = { c: list.length, s: 0, dt: 0, last: '', t: {}, rep: [], gap: [] }, ls = list.slice().sort((a, b) => a.ra.localeCompare(b.ra));
  ls.forEach((r, i) => {
    if (r.st == 'Yes') { o.s++; if (r.fa) o.dt += Math.max(0, (new Date(r.fa) - new Date(r.ra)) / 60000); }
    if (r.ra > o.last) o.last = r.ra;
    o.t[r.pt] = (o.t[r.pt] || 0) + 1;
    if (r.fa && r.ta) o.rep.push(Math.max(0, (new Date(r.fa) - new Date(r.ta)) / 60000));
    const p = ls[i - 1];
    if (p && p.fa) { const g = (new Date(r.ra) - new Date(p.fa)) / 60000; if (g > 0) o.gap.push(g); }
  });
  o.mttr = av(o.rep); o.mtbf = av(o.gap);
  return o;
}
function calc() {
  const inP = s => period == 'all' || (s || '').startsWith(period);
  const rs = db.requests.filter(r => r.k != 'pm' && inP(r.ra));
  const G = {}, M = {}, SN = {}, P = {}, PM = {}, T = {}, RCc = {};
  rs.forEach(r => (G[r.mid] = G[r.mid] || []).push(r));
  Object.entries(G).forEach(([id, l]) => { M[id] = { n: l[0].mn, d: l[0].d, ...mst(l) }; });
  db.requests.filter(r => r.s != 'done' && r.st == 'Yes').forEach(r => { if (!SN[r.mid] || r.ra < SN[r.mid]) SN[r.mid] = r.ra; });
  db.requests.filter(r => r.s == 'done' && inP(r.fa)).forEach(r => {
    if (r.rc) RCc[r.rc] = (RCc[r.rc] || 0) + 1;
    (r.sp || []).forEach(x => {

${isA ? `<div class="np flex gap-3 mt-2"><button onclick="editPM('${p.id}')" class="text-xs text-teal-700 font-semibold">✏ ${tr('edit')}</button><button onclick="delPM('${p.id}')" class="text-xs text-red-600 font-semibold">🗑 ${tr('remove')}</button></div>` : ''}</div>`;
  }).join('');
  return (isA && pmEdit == null ? `<button onclick="editPM('new')" class="${btn} mb-3 np">+ ${tr('addPlan')}</button>` : '') + form + (items || (form ? '' : `<p class="text-gray-500">${tr('noPlans')}</p>`));
}
async function savePM(e, id) {
  e.preventDefault();
  const items = $('pmc').value.split('\n').map(x => x.trim()).filter(Boolean), iv = +$('pmi').value;
  if (!(iv >= 1)) return;
  pmEdit = null;
  await adm('admin_pm_save', { p_id: id, p_machine_id: $('pmm').value, p_title: $('pmt').value.trim(), p_interval: iv, p_priority: $('pmp').value, p_checklist: items, p_next_due: $('pmd').value, p_active: $('pma').checked });
  await genPM(); render();
}
function delPM(id) { if (confirm(tr('confirmPlan'))) adm('admin_delete', { p_kind: 'plan', p_id: String(id) }); }

/* ---------- DASHBOARD ---------- */
function dashData() {
  const R = db.requests.filter(r => r.k != 'pm'), AL = db.requests, d0 = new Date(), td = ymd(d0), ago = n => ymd(new Date(Date.now() - n * 864e5));
  const inR = (r, a, b) => { const d = (r.ra || '').slice(0, 10); return d >= a && d <= b; };
  const live = R.filter(r => r.s != 'done'), stopped = new Set(live.filter(r => r.st == 'Yes').map(r => String(r.mid)));
  const lateL = live.filter(r => r.s == 'open' && slaOf(r).late), lateM = new Set(lateL.map(r => String(r.mid)));
  const mo = td.slice(0, 7), lm = ymd(new Date(d0.getFullYear(), d0.getMonth() - 1, 15)).slice(0, 7);
  const rep = m => av(R.filter(r => r.fa && r.ta && r.fa.startsWith(m)).map(r => Math.max(0, (new Date(r.fa) - new Date(r.ta)) / 60000)));
  const G = {}, T30 = {}, load = {};
  R.filter(r => inR(r, ago(29), td)).forEach(r => { (G[r.mid] = G[r.mid] || []).push(r); T30[r.pt] = (T30[r.pt] || 0) + 1; });
  live.filter(r => r.s == 'prog').forEach(r => { load[r.ts] = (load[r.ts] || 0) + 1; });
  const risk = Object.entries(G).map(([id, l]) => { const c = l.length, s = l.filter(r => r.st == 'Yes').length, sn = stopped.has(id), lt = lateM.has(id); return { id, n: l[0].mn, c, s, sn, lt, score: c * 2 + s * 3 + (sn ? 5 : 0) + (lt ? 2 : 0) }; }).sort((a, b) => b.score - a.score).slice(0, 5);
  const weeks = [...Array(8).keys()].map(i => ({ i, from: ago(6 + 7 * i), n: R.filter(r => inR(r, ago(6 + 7 * i), ago(7 * i))).length })).reverse();
  const pmOpen = AL.filter(r => r.k == 'pm' && r.s != 'done'), due = r => (r.ra || '').slice(0, 10), in7 = ago(-7);
  const pmLate = pmOpen.filter(r => due(r) < td).length;
  const pmWeek = pmOpen.filter(r => due(r) >= td && due(r) <= in7).length + (db.plans || []).filter(p => p.ac && p.nd > td && p.nd <= in7 && !pmOpen.some(r => r.pl == p.id)).length;
  const pmDone = AL.filter(r => r.k == 'pm' && r.s == 'done' && (r.fa || '').startsWith(mo)).length;
  return {
    pmLate, pmWeek, pmDone, stopped: stopped.size, openN: live.filter(r => r.s == 'open').length, progN: live.filter(r => r.s == 'prog').length, lateN: lateL.length,
    closedToday: R.filter(r => r.s == 'done' && (r.fa || '').startsWith(td)).length,
    w0: R.filter(r => inR(r, ago(6), td)).length, w1: R.filter(r => inR(r, ago(13), ago(7))).length,
    mttrM: rep(mo), mttrL: rep(lm), risk, weeks, types: Object.entries(T30).sort((a, b) => b[1] - a[1]).slice(0, 5), load: Object.entries(load)
  };
}
// next preventive jobs: everything overdue plus what falls due in the next 14 days (tap a row to open the machine file)
function pmBox() {
  const l = pmState().items.filter(x => x.d <= 14).slice(0, 8);
  const st = x => x.d < 0 ? `<span class="text-xs font-bold text-white bg-red-600 rounded-full px-2 py-1 whitespace-nowrap">${tr('pmOverdueBy')} ${-x.d} ${tr('days')}</span>`
    : x.d == 0 ? `<span class="text-xs font-bold text-blue-800 bg-blue-100 rounded-full px-2 py-1 whitespace-nowrap">${tr('pmToday')}</span>`
    : `<span class="text-xs font-bold ${x.d <= PM_SOON ? 'text-amber-800 bg-amber-100' : 'text-gray-600 bg-gray-100'} rounded-full px-2 py-1 whitespace-nowrap">${tr('pmInD').replace('{n}', x.d)}</span>`;
  return box('🗓 ' + tr('pmUpcoming'), l.length ? l.map(x => `<div onclick="goM('${esc(x.mid)}')" class="flex justify-between items-center gap-2 border-b py-2 cursor-pointer"><div class="min-w-0"><b>${esc(x.mn)}</b><div class="text-xs text-gray-500">${esc(x.t)} · ${esc(x.due)}${x.s == 'prog' ? ' · ' + tr('sProg') : ''}</div></div>${st(x)}</div>`).join('') : `<p class="text-gray-500">${tr('none')}</p>`);
}
function aDash() {
  const d = dashData(), none = `<p class="text-gray-500">${tr('none')}</p>`, mm = v => v == null ? tr('na') : dhm(v);
  const arrow = (a, b) => a > b ? '▲' : a < b ? '▼' : '＝';
  const bd = x => x.score >= 10 ? 'bg-red-100 text-red-700' : x.score >= 5 ? 'bg-amber-100 text-amber-800' : 'bg-gray-100 text-gray-600';
  return `<div class="grid grid-cols-2 sm:grid-cols-5 gap-3 mb-3">${kpi(d.stopped, tr('stoppedMach'), d.stopped ? 'text-red-600' : 'text-teal-800')}${kpi(d.openN, tr('notTaken'), d.openN ? 'text-orange-600' : 'text-teal-800')}${kpi(d.progN, tr('progN'))}${kpi(d.lateN, tr('lateN'), d.lateN ? 'text-red-600' : 'text-teal-800')}${kpi(d.closedToday, tr('closedToday'), 'text-green-700')}</div>
<div class="grid grid-cols-2 gap-3 mb-5">${kpi(d.w0 + ' ' + arrow(d.w0, d.w1), tr('last7bk') + ' (' + tr('prev7') + ': ' + d.w1 + ')')}${kpi(mm(d.mttrM), tr('mttrMonth') + ' (' + tr('lastMonth') + ': ' + mm(d.mttrL) + ')')}</div>
<div class="grid grid-cols-3 gap-3 mb-5">${kpi(d.pmLate, tr('pmLate'), d.pmLate ? 'text-red-600' : 'text-teal-800')}${kpi(d.pmWeek, tr('pmWeek'), 'text-blue-700')}${kpi(d.pmDone, tr('pmDoneM'), 'text-green-700')}</div>
${pmBox()}
${box(tr('riskMach'), d.risk.length ? d.risk.map(x => `<div onclick="goM('${esc(x.id)}')" class="flex justify-between items-center gap-2 border-b py-2 cursor-pointer"><div><b>${esc(x.n)}</b><div class="text-xs text-gray-500">${tr('total')}: ${x.c} · ${tr('stops')}: ${x.s}</div></div><div class="flex flex-wrap gap-1 justify-end">${x.sn ? `<span class="text-xs font-bold text-white bg-red-600 rounded-full px-2 py-1">${tr('stoppedMach')}</span>` : ''}${x.lt ? `<span class="text-xs font-bold text-red-700 bg-red-100 rounded-full px-2 py-1">${tr('overdue')}</span>` : ''}<span class="text-xs font-bold rounded-full px-2 py-1 ${bd(x)}">${x.score}</span></div></div>`).join('') + `<p class="text-xs text-gray-500 mt-2">${tr('riskNote')}</p>` : none)}
${box(tr('weekly'), bars(d.weeks.map(w => [w.i == 0 ? tr('last7') : tr('wkOf') + ' ' + w.from.slice(5), w.n]), 'bg-orange-600'))}
${box(tr('typesRecent'), d.types.length ? bars(d.types.map(([k, v]) => [tl(k), v]), 'bg-blue-600') : none)}
${me.r == 'admin' ? box(tr('workload'), d.load.length ? d.load.map(([e, n]) => `<div class="flex justify-between border-b py-1 text-sm"><span>${who(e)}</span><b>${n}</b></div>`).join('') : none) : ''}`;
}

/* ---------- WORKSHOP SCREEN MODE ---------- */
function toggleTv() {
  tv = !tv;
  const d = document.documentElement;
  if (tv && d.requestFullscreen) d.requestFullscreen().catch(() => {});
  if (!tv && document.fullscreenElement && document.exitFullscreen) document.exitFullscreen();
  render();
}
document.addEventListener('fullscreenchange', () => { if (tv && document.fullscreenEnabled && !document.fullscreenElement) { tv = false; render(); } });

/* ---------- START ---------- */
(async () => {
  $('app').innerHTML = `<p class="p-8 text-center text-gray-500">${tr('loading')}</p>`;
  try {
    await load(true);
    await genPM();
    if (me && me.r == 'admin' && !(await rpc('admin_login', { p_h: me.h }))) me = null;
    if (me && (me.r == 'technician' || me.r == 'supervisor') && !db.techs.some(t => t.e == me.e && t.st == 'approved')) me = null;
    save();
  } catch (e) {
    $('app').innerHTML = `<div class="p-8 text-center text-red-700">${tr('netErr')}<button onclick="location.reload()" class="${btn} mt-4">↻</button></div>`;
    return;
  }
  render();
  setInterval(poll, 10000);
})();
